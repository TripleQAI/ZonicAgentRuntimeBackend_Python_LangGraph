[project]
name = "zonic-agent-runtime"
version = "0.1.0"
description = "Zonic Agent Runtime: builder workflows compiled at run time to LangGraph StateGraphs. Persistence through the pgfoundation gateway; no database driver."
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Minor versions are pinned (design AD-15); upgrades happen in their own pull
# request with the compiler, conformance, scenario and checkpointer suites.
dependencies = [
    "langgraph~=1.2.17",
    "langchain[mcp]~=1.4.7",
    "langchain-core~=1.7.0",
    "langchain-aws~=1.9.0",
    "langchain-openai~=1.7.2",
    "langchain-anthropic~=1.7.6",
    "langfuse~=5.0.4",
    "fastapi~=0.162.0",
    "uvicorn[standard]~=0.54.0",
    "uvloop~=0.23.0; sys_platform != 'win32'",
    "pydantic~=2.14.1",
    "pydantic-settings~=2.16.1",
    "httpx~=0.28.1",
    "orjson~=3.13.0",
    "zstandard~=0.25.0",
    "pycryptodome~=4.2.0",
    "PyJWT[crypto]~=2.15.1",
    "opentelemetry-sdk~=1.45.1",
    "prometheus-client~=0.26.0",
    "jsonschema~=4.26.0",
]

[dependency-groups]
dev = [
    "ruff~=0.17.2",
    "mypy~=2.4.0",
    "import-linter~=2.15",
    "pip-audit~=2.10.1",
    "types-jsonschema",
]
test = [
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.1",
    "pytest-cov~=7.1.0",
    "hypothesis~=6.170.9",
    "syrupy~=6.1.1",
    "respx~=0.23.1",
    "fastmcp~=4.1.3",
    "langgraph-checkpoint-conformance~=0.0.2",
    "pyyaml~=6.0",
]

[tool.uv]
default-groups = ["dev", "test"]

[build-system]
requires = ["hatchling~=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zonic_runtime"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["zonic_runtime"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["zstandard.*", "Crypto.*", "langgraph_checkpoint_conformance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not sql and not live and not load and not spike'"
markers = [
    "sql: needs the gateway and the runtime_test branch (nightly, opt-in)",
    "live: needs real models, MCP server or gateway (opt-in)",
    "load: performance runs (before release)",
    "spike: Phase 0 verification spikes against the installed LangGraph (run explicitly)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:langchain_core.*",
    "ignore::DeprecationWarning:langgraph.*",
    "ignore::DeprecationWarning:langfuse.*",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/zonic_runtime"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
