AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Zonic Agent Runtime (Python, LangGraph) on ECS Fargate (plan P5-04, decision D-3): one uvicorn
  worker per 1 vCPU / 2 GB task with a public IP and no load balancer, HTTPS through CloudFront
  (its origin an A record a small Lambda keeps on the running task's IP), credentials from Secrets
  Manager, models through the task role on Bedrock. Deployed by deploy/aws/deploy.sh.

Parameters:
  Stage:
    Type: String
    Default: dev
  ImageUri:
    Type: String
  DesiredCount:
    Type: Number
    Default: 1
  Cpu:
    Type: Number
    Default: 1024
  Memory:
    Type: Number
    Default: 2048
  ZonicEnv:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  GatewayBaseUrl:
    Type: String
  OidcIssuer:
    Type: String
  OidcAudience:
    Type: String
  McpBaseUrl:
    Type: String
  GatewayApiKeySecretArn:
    Type: String
  McpAuthTokenSecretArn:
    Type: String
  CheckpointAesKeySecretArn:
    Type: String
  OpenAiApiKeySecretArn:
    Type: String
  NebiusApiKeySecretArn:
    Type: String
  LangfuseBaseUrl:
    Type: String
    Description: The Langfuse project's host (Cloud or self-hosted)
  LangfusePublicKeySecretArn:
    Type: String
  LangfuseSecretKeySecretArn:
    Type: String
  CloudFrontPrefixList:
    Type: String
    Default: pl-3b927c52  # com.amazonaws.global.cloudfront.origin-facing in us-east-1
  HostedZoneId:
    Type: String
    Default: Z08614611QL8HCC5Q6WWE
    Description: The zone that holds the origin record
  HostedZoneName:
    Type: String
    Default: dev.tripleq.ai
  ResourcesDir:
    Type: String
    Default: /app/resources
    Description: The resources directory in the image (the load test's image has its own)

Resources:
  # --- network: a VPC of its own, public subnets, no NAT gateway -------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true  # instances reach each other by host name (the run's lease)
      Tags: [{ Key: Name, Value: !Sub "zonic-agent-runtime-${Stage}" }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: { RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway }
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/20
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.16.0/20
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable }
  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Runtime tasks; the public port from CloudFront only, the internal port between tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourcePrefixListId: !Ref CloudFrontPrefixList }
  TaskInternalIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 9000  # the public port for the load generator, the internal port for the proxy and /metrics

  # --- origin record and CloudFront ------------------------------------------------------------
  # No load balancer (about $16 a month): CloudFront's origin is an A record that OriginDnsUpdater
  # points at the newest healthy task's public IP whenever a task in the cluster changes state.
  # The same design as the Node.js runtime (ZonicAgentRuntimeServer_Nodejs/deploy/aws-fargate).
  # The record is the updater's, not the stack's: delete it by hand after deleting the stack.
  OriginDnsUpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: origin-record
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ecs:ListTasks, ecs:DescribeTasks, ec2:DescribeNetworkInterfaces]
                Resource: "*"
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
  OriginDnsUpdaterLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/zonic/agent-runtime/${Stage}/origin-dns"
      RetentionInDays: 14
  OriginDnsUpdater:
    Type: AWS::Lambda::Function
    Properties:
      Description: Points the runtime's origin record at the running task
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt OriginDnsUpdaterRole.Arn
      LoggingConfig: { LogGroup: !Ref OriginDnsUpdaterLogs }
      Environment:
        Variables:
          CLUSTER: !Ref Cluster
          SERVICE: runtime
          ZONE_ID: !Ref HostedZoneId
          RECORD: !Sub "zonic-agent-runtime-${Stage}-origin.${HostedZoneName}"
      Code:
        ZipFile: |
          import os, boto3
          ecs = boto3.client('ecs'); ec2 = boto3.client('ec2'); r53 = boto3.client('route53')

          def handler(event, context):
              cluster, service = os.environ['CLUSTER'], os.environ['SERVICE']
              arns = ecs.list_tasks(cluster=cluster, serviceName=service, desiredStatus='RUNNING')['taskArns']
              tasks = ecs.describe_tasks(cluster=cluster, tasks=arns)['tasks'] if arns else []
              tasks = [t for t in tasks if t.get('lastStatus') == 'RUNNING']
              # A task that failed its health check must not take over from one that passes.
              healthy = [t for t in tasks if t.get('healthStatus') == 'HEALTHY']
              tasks = sorted(healthy or tasks, key=lambda t: t.get('startedAt') or t['createdAt'], reverse=True)
              for task in tasks:
                  details = {d['name']: d['value'] for a in task.get('attachments', []) for d in a.get('details', [])}
                  eni = details.get('networkInterfaceId')
                  if not eni:
                      continue
                  nic = ec2.describe_network_interfaces(NetworkInterfaceIds=[eni])['NetworkInterfaces'][0]
                  ip = nic.get('Association', {}).get('PublicIp')
                  if not ip:
                      continue
                  r53.change_resource_record_sets(HostedZoneId=os.environ['ZONE_ID'], ChangeBatch={'Changes': [{
                      'Action': 'UPSERT',
                      'ResourceRecordSet': {'Name': os.environ['RECORD'], 'Type': 'A', 'TTL': 60,
                                            'ResourceRecords': [{'Value': ip}]}}]})
                  print(f"{os.environ['RECORD']} -> {ip} ({task['taskArn'].split('/')[-1]})")
                  return ip
              print('no running task with a public IP')
  TaskChanges:
    Type: AWS::Events::Rule
    Properties:
      Description: Every task change in the cluster (started, health changed, stopped) re-points the origin record
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail: { clusterArn: [!GetAtt Cluster.Arn] }
      Targets: [{ Id: origin-dns, Arn: !GetAtt OriginDnsUpdater.Arn }]
  TaskChangesPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OriginDnsUpdater
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TaskChanges.Arn

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "zonic-agent-runtime-${Stage}"
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: task
            DomainName: !Sub "zonic-agent-runtime-${Stage}-origin.${HostedZoneName}"
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 8000
              OriginReadTimeout: 60  # bytes arrive at least every sse.heartbeatSeconds
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: task
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false  # compression would buffer the event stream
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader

  # --- ECS -----------------------------------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "zonic-agent-runtime-${Stage}"
      ClusterSettings: [{ Name: containerInsights, Value: disabled }]
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/zonic/agent-runtime/${Stage}"
      RetentionInDays: 30
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref GatewayApiKeySecretArn
                  - !Ref McpAuthTokenSecretArn
                  - !Ref CheckpointAesKeySecretArn
                  - !Ref OpenAiApiKeySecretArn
                  - !Ref NebiusApiKeySecretArn
                  - !Ref LangfusePublicKeySecretArn
                  - !Ref LangfuseSecretKeySecretArn
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: bedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Effect: Allow
                Action: [bedrock:ApplyGuardrail]
                Resource: !Sub "arn:aws:bedrock:*:${AWS::AccountId}:guardrail/*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "zonic-agent-runtime-${Stage}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: runtime
          Image: !Ref ImageUri
          Essential: true
          StopTimeout: 90  # uvicorn waits up to 60 s; the drain is shutdown.drainSeconds
          PortMappings:
            - { ContainerPort: 8000, Protocol: tcp }
            - { ContainerPort: 9000, Protocol: tcp }
          # Liveness, not readiness: a gateway outage must not make ECS replace the task. The
          # origin updater prefers a HEALTHY task, so a new task takes over only once it answers.
          HealthCheck:
            Command:
              - CMD
              - /app/.venv/bin/python
              - -c
              - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"
            Interval: 15
            Timeout: 5
            StartPeriod: 60
            Retries: 3
          Environment:
            - { Name: ZONIC_ENV, Value: !Ref ZonicEnv }
            - { Name: ZONIC_RESOURCES_DIR, Value: !Ref ResourcesDir }
            - { Name: ZONIC_GATEWAY_BASE_URL, Value: !Ref GatewayBaseUrl }
            - { Name: ZONIC_OIDC_ISSUER, Value: !Ref OidcIssuer }
            - { Name: ZONIC_OIDC_AUDIENCE, Value: !Ref OidcAudience }
            - { Name: ZONIC_OIDC_JWKS_URL, Value: !Sub "${OidcIssuer}/.well-known/jwks.json" }
            - { Name: ZONIC_AWS_REGION, Value: !Ref AWS::Region }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: ZONIC_MCP_BASE_URL, Value: !Ref McpBaseUrl }
            - { Name: ZONIC_LANGFUSE_BASE_URL, Value: !Ref LangfuseBaseUrl }
          Secrets:
            - { Name: ZONIC_GATEWAY_API_KEY, ValueFrom: !Ref GatewayApiKeySecretArn }
            - { Name: ZONIC_MCP_AUTH_TOKEN, ValueFrom: !Ref McpAuthTokenSecretArn }
            - { Name: ZONIC_CHECKPOINT_AES_KEY, ValueFrom: !Ref CheckpointAesKeySecretArn }
            - { Name: ZONIC_OPENAI_API_KEY, ValueFrom: !Ref OpenAiApiKeySecretArn }
            - { Name: ZONIC_NEBIUS_API_KEY, ValueFrom: !Ref NebiusApiKeySecretArn }
            - { Name: ZONIC_LANGFUSE_PUBLIC_KEY, ValueFrom: !Ref LangfusePublicKeySecretArn }
            - { Name: ZONIC_LANGFUSE_SECRET_KEY, ValueFrom: !Ref LangfuseSecretKeySecretArn }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: runtime

  Service:
    Type: AWS::ECS::Service
    DependsOn: TaskChangesPermission  # the first task's start must reach the origin updater
    Properties:
      ServiceName: runtime
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED  # egress to the gateway, Bedrock and the MCP server without a NAT gateway
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]

Outputs:
  Url:
    Value: !Sub "https://${Distribution.DomainName}"
  OriginRecord:
    Value: !Sub "zonic-agent-runtime-${Stage}-origin.${HostedZoneName}"
  OriginDnsUpdater:
    Value: !Ref OriginDnsUpdater
  Cluster:
    Value: !Ref Cluster
  Service:
    Value: !GetAtt Service.Name
  Subnets:
    Value: !Join [",", [!Ref SubnetA, !Ref SubnetB]]
  TaskSecurityGroup:
    Value: !Ref TaskSecurityGroup
  LogGroup:
    Value: !Ref LogGroup
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
