AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Zonic Agent Runtime (Python, LangGraph) on ECS Fargate (plan P5-04, decision D-3): one uvicorn
  worker per 1 vCPU / 2 GB task behind an ALB, HTTPS through CloudFront, credentials from Secrets
  Manager, models through the task role on Bedrock. Deployed by deploy/aws/deploy.sh.

Parameters:
  Stage:
    Type: String
    Default: dev
  ImageUri:
    Type: String
  DesiredCount:
    Type: Number
    Default: 1
  Cpu:
    Type: Number
    Default: 1024
  Memory:
    Type: Number
    Default: 2048
  ZonicEnv:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  GatewayBaseUrl:
    Type: String
  OidcIssuer:
    Type: String
  OidcAudience:
    Type: String
  McpBaseUrl:
    Type: String
  GatewayApiKeySecretArn:
    Type: String
  McpAuthTokenSecretArn:
    Type: String
  CheckpointAesKeySecretArn:
    Type: String
  OpenAiApiKeySecretArn:
    Type: String
  CloudFrontPrefixList:
    Type: String
    Default: pl-3b927c52  # com.amazonaws.global.cloudfront.origin-facing in us-east-1
  ResourcesDir:
    Type: String
    Default: /app/resources
    Description: The resources directory in the image (the load test's image has its own)

Resources:
  # --- network: a VPC of its own, public subnets, no NAT gateway -------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true  # instances reach each other by host name (the run's lease)
      Tags: [{ Key: Name, Value: !Sub "zonic-agent-runtime-${Stage}" }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: { RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway }
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/20
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.16.0/20
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable }
  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable }

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Runtime ALB, reachable from CloudFront only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourcePrefixListId: !Ref CloudFrontPrefixList }
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Runtime tasks; the public port from the ALB, the internal port between tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AlbSecurityGroup }
  TaskInternalIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 9000  # the public port for the load generator, the internal port for the proxy and /metrics

  # --- load balancer and CloudFront ------------------------------------------------------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        # Above the SSE heartbeat gap (sse.heartbeatSeconds, 15 s)
        - { Key: idle_timeout.timeout_seconds, Value: "120" }
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        # Above shutdown.drainSeconds (30 s), so a draining task finishes its streams
        - { Key: deregistration_delay.timeout_seconds, Value: "45" }
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "zonic-agent-runtime-${Stage}"
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60  # bytes arrive at least every sse.heartbeatSeconds
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false  # compression would buffer the event stream
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader

  # --- ECS -----------------------------------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "zonic-agent-runtime-${Stage}"
      ClusterSettings: [{ Name: containerInsights, Value: disabled }]
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/zonic/agent-runtime/${Stage}"
      RetentionInDays: 30
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref GatewayApiKeySecretArn
                  - !Ref McpAuthTokenSecretArn
                  - !Ref CheckpointAesKeySecretArn
                  - !Ref OpenAiApiKeySecretArn
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: bedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Effect: Allow
                Action: [bedrock:ApplyGuardrail]
                Resource: !Sub "arn:aws:bedrock:*:${AWS::AccountId}:guardrail/*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "zonic-agent-runtime-${Stage}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: runtime
          Image: !Ref ImageUri
          Essential: true
          StopTimeout: 90  # uvicorn waits up to 60 s; the drain is shutdown.drainSeconds
          PortMappings:
            - { ContainerPort: 8000, Protocol: tcp }
            - { ContainerPort: 9000, Protocol: tcp }
          Environment:
            - { Name: ZONIC_ENV, Value: !Ref ZonicEnv }
            - { Name: ZONIC_RESOURCES_DIR, Value: !Ref ResourcesDir }
            - { Name: ZONIC_GATEWAY_BASE_URL, Value: !Ref GatewayBaseUrl }
            - { Name: ZONIC_OIDC_ISSUER, Value: !Ref OidcIssuer }
            - { Name: ZONIC_OIDC_AUDIENCE, Value: !Ref OidcAudience }
            - { Name: ZONIC_OIDC_JWKS_URL, Value: !Sub "${OidcIssuer}/.well-known/jwks.json" }
            - { Name: ZONIC_AWS_REGION, Value: !Ref AWS::Region }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: ZONIC_MCP_BASE_URL, Value: !Ref McpBaseUrl }
          Secrets:
            - { Name: ZONIC_GATEWAY_API_KEY, ValueFrom: !Ref GatewayApiKeySecretArn }
            - { Name: ZONIC_MCP_AUTH_TOKEN, ValueFrom: !Ref McpAuthTokenSecretArn }
            - { Name: ZONIC_CHECKPOINT_AES_KEY, ValueFrom: !Ref CheckpointAesKeySecretArn }
            - { Name: ZONIC_OPENAI_API_KEY, ValueFrom: !Ref OpenAiApiKeySecretArn }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: runtime

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: runtime
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED  # egress to the gateway, Bedrock and the MCP server without a NAT gateway
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - { ContainerName: runtime, ContainerPort: 8000, TargetGroupArn: !Ref TargetGroup }

Outputs:
  Url:
    Value: !Sub "https://${Distribution.DomainName}"
  LoadBalancerDns:
    Value: !GetAtt LoadBalancer.DNSName
  Cluster:
    Value: !Ref Cluster
  Subnets:
    Value: !Join [",", [!Ref SubnetA, !Ref SubnetB]]
  TaskSecurityGroup:
    Value: !Ref TaskSecurityGroup
  LogGroup:
    Value: !Ref LogGroup
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
